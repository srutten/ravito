# Base de donnees locale de developpement uniquement.
# Ne pas utiliser cette definition pour un environnement partage ou de production.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: fire-support-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fire_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fire_support}
      POSTGRES_DB: ${POSTGRES_DB:-fire_support}
      # Locale et encodage fixes pour rendre les tris reproductibles entre postes.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fire-support-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fire_support} -d ${POSTGRES_DB:-fire_support}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  fire-support-db-data:
